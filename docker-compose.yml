services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: merchstudio
      POSTGRES_PASSWORD: merchstudio
      POSTGRES_DB: merchstudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://merchstudio:merchstudio@postgres:5432/merchstudio
      S3_ENDPOINT: http://minio:9000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - minio

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  minio_data:
